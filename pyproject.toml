[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2tiktok"
version = "0.1.0"
description = "Transforme une vidéo YouTube en plusieurs clips verticaux sous-titrés pour TikTok"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "anthropic>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt2tiktok = "yt2tiktok.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
